<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, world</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="eyebrow">charleneyjh.github.io</p>
    <h1>Hello, world</h1>
    <p class="lede">A tiny page to try out designing together. Click the comment button in the corner, then click anything here to leave a note on it.</p>

    <section class="card">
      <h2>A component with behavior</h2>
      <p>You've clicked <strong id="count">0</strong> times.</p>
      <button id="counter" type="button">Click me</button>
    </section>
  </main>

  <script>
    const count = document.getElementById('count');
    document.getElementById('counter').addEventListener('click', () => {
      count.textContent = Number(count.textContent) + 1;
    });

    // Dev-only: the comment overlay never loads on the published site.
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      document.body.appendChild(Object.assign(document.createElement('script'), { src: 'dev/annotate.js' }));
    }
  </script>
</body>
</html>
