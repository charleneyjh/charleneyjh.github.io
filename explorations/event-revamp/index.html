<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual revamp — layout studies</title><link rel="stylesheet" href="/assets/fonts/portfolio-fonts.css"><style>

</style></head><body data-mode="editorial"><header><a href="/work/custom-events/#event-visual-revamp">← Back to case study</a><nav aria-label="Layout options"><button data-mode="editorial" aria-pressed="true">01 Editorial reveal</button><button data-mode="tabs" aria-pressed="false">02 Before / after tabs</button><button data-mode="grid" aria-pressed="false">03 Comparison grid</button></nav></header><main><div class="intro"><p class="eyebrow">VISUAL REVAMP · LAYOUT STUDIES</p><h1>A new visual language</h1><p id="mode-description">A quiet before image sets the context; the new design gets the space and emphasis.</p></div><section class="comparison"><div class="section-title"><span>01</span><h2>Upgrade page</h2></div><div class="toggle" aria-label="Upgrade comparison"><button data-view="before">Before</button><button data-view="after" aria-pressed="true">After</button></div><div class="comparison-layout"><figure class="before"><figcaption>Before</figcaption><a href="img/upgrade-before.png" target="_blank" rel="noopener"><img src="img/upgrade-before.png" alt="Before" loading="lazy"></a></figure><div class="after-group"><figure class="upgrade-tall"><figcaption>After · Upgrade page</figcaption><a href="img/upgrade-after.png" target="_blank" rel="noopener"><img src="img/upgrade-after.png" alt="After · Upgrade page" loading="lazy"></a></figure></div></div></section><section class="comparison"><div class="section-title"><span>02</span><h2>Empty states</h2></div><div class="toggle" aria-label="Empty state comparison"><button data-view="before">Before</button><button data-view="after" aria-pressed="true">After</button></div><div class="comparison-layout"><figure class="before"><figcaption>Before</figcaption><a href="img/empty-before.png" target="_blank" rel="noopener"><img src="img/empty-before.png" alt="Before" loading="lazy"></a></figure><div class="after-group"><figure class=""><figcaption>After · App events</figcaption><a href="img/empty-after-app.png" target="_blank" rel="noopener"><img src="img/empty-after-app.png" alt="After · App events" loading="lazy"></a></figure><figure class=""><figcaption>After · Custom events</figcaption><a href="img/empty-after-custom.png" target="_blank" rel="noopener"><img src="img/empty-after-custom.png" alt="After · Custom events" loading="lazy"></a></figure></div></div></section><footer>Original screenshots preserved. Click any image to inspect it at full size.</footer></main><script>const descriptions={editorial:'A quiet before image sets the context; the new design gets the space and emphasis.',tabs:'A focused comparison with a Before / After switch for each set. Less scrolling, with one state visible at a time.',grid:'A structured comparison: original on the left, updated designs on the right.'};document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.body.dataset.mode=b.dataset.mode;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('#mode-description').textContent=descriptions[b.dataset.mode];history.replaceState(null,'','#'+b.dataset.mode)}));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const section=b.closest('.comparison');section.dataset.view=b.dataset.view;section.querySelectorAll('.toggle button').forEach(x=>x.setAttribute('aria-pressed',x===b))}));const selected=document.querySelector('nav [data-mode="'+location.hash.slice(1)+'"]');if(selected)selected.click();</script></body></html>
